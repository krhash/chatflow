# Valkey (Redis-compatible) Cache Configuration for AWS ElastiCache Serverless

# ========== Connection Settings ==========
# ElastiCache Serverless endpoint (Valkey-compatible)
valkey.host=redis-y79o1w.serverless.usw2.cache.amazonaws.com
valkey.port=6379

# Connection timeouts (milliseconds)
valkey.connectionTimeout=5000
valkey.socketTimeout=5000

# Authentication (leave empty if no password required)
valkey.password=

# SSL/TLS Settings
# ElastiCache Serverless requires SSL
valkey.ssl.enabled=true

# ========== Connection Pool Configuration ==========
# Maximum total connections in the pool
valkey.pool.maxTotal=20

# Maximum idle connections kept in pool
valkey.pool.maxIdle=10

# Minimum idle connections maintained in pool
valkey.pool.minIdle=2

# Test connection health when borrowing from pool
valkey.pool.testOnBorrow=true

# Maximum wait time for connection (milliseconds)
valkey.pool.maxWaitMillis=3000

# ========== Cache Configuration ==========
# Time-to-live for cached messages (seconds)
# 3600 seconds = 1 hour
valkey.cache.ttl.seconds=3600

# Key prefix for all cache entries
# Format: chatflow:msg:{messageId}
valkey.cache.keyPrefix=chatflow:msg:

# Enable compression for large messages (optional)
valkey.cache.compression.enabled=false

# ========== Retry Configuration ==========
# Maximum retry attempts for failed operations
valkey.maxRetries=3

# Retry delay (milliseconds)
valkey.retryDelayMs=100

# ========== Performance Tuning ==========
# These settings are optimized for AWS ElastiCache Serverless
# Adjust based on your workload and monitoring

# Notes:
# - ElastiCache Serverless auto-scales, so pool size can be moderate
# - SSL is required for ElastiCache Serverless
# - TTL of 1 hour balances cache hit rate with memory usage
# - Key prefix helps organize cache entries and avoid collisions
