# ==========================================
# TEST 1: Conservative Configuration
# Simulates small batch behavior (~100 messages)
# ==========================================

# Database Type
database.type=DYNAMODB

# ==========================================
# AWS Configuration
# ==========================================

aws.region=us-east-1

# ==========================================
# DynamoDB Configuration
# ==========================================

dynamodb.tableName=chatflow-messages
dynamodb.gsi.roomTimestamp=room-timestamp-index
dynamodb.gsi.userTimestamp=user-timestamp-index
dynamodb.gsi.typeTimestamp=type-timestamp-index

# ==========================================
# Batch Configuration
# ==========================================

# DynamoDB batch size (fixed at API limit)
batch.size=25

# Flush interval: 1000ms (slow flush)
# Simulates processing ~100 messages per cycle
# Lower throughput, higher latency, lower resource usage
batch.flushIntervalMs=1000

# ==========================================
# Thread Pool Configuration
# ==========================================

# Small thread pool for conservative approach
threadPool.coreSize=4
threadPool.maxSize=8
threadPool.keepAliveSeconds=60

# Smaller task queue (fewer concurrent batches)
threadPool.taskQueueSize=3000

# ==========================================
# Message Queue Configuration
# ==========================================

# Large buffer to compensate for slow flush
queue.maxSize=50000
queue.rejectionAlertThrottleMs=5000

# ==========================================
# Retry Configuration
# ==========================================

retry.maxAttempts=3
retry.baseDelayMs=100

# ==========================================
# Expected Performance
# ==========================================
# Throughput: ~1,000-1,500 msg/sec
# Avg Latency: 100-150ms
# Resource Usage: Low (CPU ~20-30%)
# Best for: Low-resource environments, development
