# ==========================================
# TEST 4: Maximum Throughput Configuration
# Simulates very large batch behavior (~5000 messages)
# ==========================================

# Database Type
database.type=DYNAMODB

# ==========================================
# AWS Configuration
# ==========================================

aws.region=us-east-1

# ==========================================
# DynamoDB Configuration
# ==========================================

dynamodb.tableName=chatflow-messages
dynamodb.gsi.roomTimestamp=room-timestamp-index
dynamodb.gsi.userTimestamp=user-timestamp-index
dynamodb.gsi.typeTimestamp=type-timestamp-index

# ==========================================
# Batch Configuration
# ==========================================

# DynamoDB batch size (fixed at API limit)
batch.size=25

# Flush interval: 100ms (very fast flush)
# Simulates processing ~5000 messages per cycle
# Maximum throughput at cost of high resource usage
batch.flushIntervalMs=100

# ==========================================
# Thread Pool Configuration
# ==========================================

# Maximum thread pool for peak throughput
threadPool.coreSize=20
threadPool.maxSize=40
threadPool.keepAliveSeconds=60

# Very large task queue for maximum concurrency
threadPool.taskQueueSize=15000

# ==========================================
# Message Queue Configuration
# ==========================================

# Very large buffer for maximum throughput
queue.maxSize=150000
queue.rejectionAlertThrottleMs=5000

# ==========================================
# Retry Configuration
# ==========================================

retry.maxAttempts=3
retry.baseDelayMs=100

# ==========================================
# Expected Performance
# ==========================================
# Throughput: ~10,000-12,000 msg/sec
# Avg Latency: 35-50ms
# Resource Usage: Very High (CPU ~85-95%)
# Best for: Stress testing, finding system limits
# Warning: May experience diminishing returns
