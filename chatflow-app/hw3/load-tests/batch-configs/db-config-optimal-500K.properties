# ==========================================
# TEST 5: Optimal Configuration (RECOMMENDED)
# Best balance of throughput, latency, and resource efficiency
# Simulates ~1000 message batch with optimized parameters
# ==========================================

# Database Type
database.type=DYNAMODB

# ==========================================
# AWS Configuration
# ==========================================

aws.region=us-east-1

# ==========================================
# DynamoDB Configuration
# ==========================================

dynamodb.tableName=chatflow-messages
dynamodb.gsi.roomTimestamp=room-timestamp-index
dynamodb.gsi.userTimestamp=user-timestamp-index
dynamodb.gsi.typeTimestamp=type-timestamp-index

# ==========================================
# Batch Configuration
# ==========================================

# DynamoDB batch size (fixed at API limit)
batch.size=25

# Flush interval: 300ms (optimized)
# Provides excellent balance between throughput and latency
# Processes ~1000 messages per flush cycle
batch.flushIntervalMs=300

# ==========================================
# Thread Pool Configuration
# ==========================================

# Optimized thread pool
# Core threads handle steady load
# Max threads handle burst traffic
threadPool.coreSize=16
threadPool.maxSize=32
threadPool.keepAliveSeconds=60

# Large enough to prevent rejections during bursts
threadPool.taskQueueSize=10000

# ==========================================
# Message Queue Configuration
# ==========================================

# Sufficient buffer for ~6-8 seconds of peak load
# At 8,333 msg/sec: 50,000 msgs ? 6 seconds buffer
queue.maxSize=50000
queue.rejectionAlertThrottleMs=5000

# ==========================================
# Retry Configuration
# ==========================================

# Retry failed batches with exponential backoff
retry.maxAttempts=3
retry.baseDelayMs=100
