# ==========================================
# TEST 3: Aggressive Configuration
# Simulates large batch behavior (~1000 messages)
# ==========================================

# Database Type
database.type=DYNAMODB

# ==========================================
# AWS Configuration
# ==========================================

aws.region=us-east-1

# ==========================================
# DynamoDB Configuration
# ==========================================

dynamodb.tableName=chatflow-messages
dynamodb.gsi.roomTimestamp=room-timestamp-index
dynamodb.gsi.userTimestamp=user-timestamp-index
dynamodb.gsi.typeTimestamp=type-timestamp-index

# ==========================================
# Batch Configuration
# ==========================================

# DynamoDB batch size (fixed at API limit)
batch.size=25

# Flush interval: 200ms (fast flush)
# Simulates processing ~1000 messages per cycle
# High throughput, lower latency
batch.flushIntervalMs=200

# ==========================================
# Thread Pool Configuration
# ==========================================

# Large thread pool for high throughput
threadPool.coreSize=16
threadPool.maxSize=32
threadPool.keepAliveSeconds=60

# Large task queue for concurrent processing
threadPool.taskQueueSize=10000

# ==========================================
# Message Queue Configuration
# ==========================================

# Large buffer for high-throughput scenarios
queue.maxSize=100000
queue.rejectionAlertThrottleMs=5000

# ==========================================
# Retry Configuration
# ==========================================

retry.maxAttempts=3
retry.baseDelayMs=100

# ==========================================
# Expected Performance
# ==========================================
# Throughput: ~6,000-8,000 msg/sec
# Avg Latency: 45-60ms
# Resource Usage: High (CPU ~60-75%)
# Best for: High-load production, 500K test requirement
