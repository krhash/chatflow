# ==========================================
# TEST 2: Balanced Configuration
# Simulates medium batch behavior (~500 messages)
# ==========================================

# Database Type
database.type=DYNAMODB

# ==========================================
# AWS Configuration
# ==========================================

aws.region=us-east-1

# ==========================================
# DynamoDB Configuration
# ==========================================

dynamodb.tableName=chatflow-messages
dynamodb.gsi.roomTimestamp=room-timestamp-index
dynamodb.gsi.userTimestamp=user-timestamp-index
dynamodb.gsi.typeTimestamp=type-timestamp-index

# ==========================================
# Batch Configuration
# ==========================================

# DynamoDB batch size (fixed at API limit)
batch.size=25

# Flush interval: 500ms (moderate flush)
# Simulates processing ~500 messages per cycle
# Balanced throughput and latency
batch.flushIntervalMs=500

# ==========================================
# Thread Pool Configuration
# ==========================================

# Moderate thread pool for balanced performance
threadPool.coreSize=8
threadPool.maxSize=16
threadPool.keepAliveSeconds=60

# Moderate task queue
threadPool.taskQueueSize=5000

# ==========================================
# Message Queue Configuration
# ==========================================

# Balanced buffer size
queue.maxSize=75000
queue.rejectionAlertThrottleMs=5000

# ==========================================
# Retry Configuration
# ==========================================

retry.maxAttempts=3
retry.baseDelayMs=100

# ==========================================
# Expected Performance
# ==========================================
# Throughput: ~3,000-4,000 msg/sec
# Avg Latency: 60-80ms
# Resource Usage: Medium (CPU ~40-50%)
# Best for: Production baseline, moderate load