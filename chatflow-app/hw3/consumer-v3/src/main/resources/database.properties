# ==========================================
# Database Configuration
# ==========================================

# Database Type (DYNAMODB, POSTGRESQL, IN_MEMORY)
database.type=DYNAMODB

# ==========================================
# AWS Configuration
# ==========================================

aws.region=us-east-1

# ==========================================
# DynamoDB Configuration
# ==========================================

dynamodb.tableName=chatflow-messages
dynamodb.gsi.roomTimestamp=room-timestamp-index
dynamodb.gsi.userTimestamp=user-timestamp-index
dynamodb.gsi.typeTimestamp=type-timestamp-index

# ==========================================
# Batch Configuration
# ==========================================

# Number of messages per batch (DynamoDB limit: 25)
batch.size=25

# Flush interval in milliseconds
# Lower = higher throughput, more API calls
# Higher = better batching, lower API calls
batch.flushIntervalMs=500

# ==========================================
# Thread Pool Configuration
# ==========================================

# Core threads (always alive)
# Recommendation: 1-2 threads per CPU core
threadPool.coreSize=4

# Maximum threads under load
# For 500K messages in 60s (~8,333 msg/s):
# Needed throughput: 8,333 / 25 = 333 batches/sec
# With 50ms write latency: 1 thread = 20 batches/sec
# Need: 333 / 20 = ~17 threads minimum
# Add buffer for peaks: 12-16 threads recommended
threadPool.maxSize=12

# Keep-alive time for excess threads (seconds)
threadPool.keepAliveSeconds=60

# Thread pool task queue size
# Holds BatchWriteTask objects waiting for thread
# Should be small (tasks are cheap to create)
threadPool.taskQueueSize=100

# ==========================================
# Message Queue Configuration
# ==========================================

# Maximum messages in buffer before dropping
# At 1KB per message: 10,000 messages = ~10MB memory
# Adjust based on available memory
queue.maxSize=10000

# Alert throttle time (milliseconds)
# Prevents log spam when queue is consistently full
queue.rejectionAlertThrottleMs=5000

# ==========================================
# Retry Configuration
# ==========================================

# Maximum retry attempts for failed batch writes
retry.maxAttempts=3

# Base delay for exponential backoff (milliseconds)
# Actual delay = baseDelay * 2^retryAttempt
# Attempt 1: 100ms, Attempt 2: 200ms, Attempt 3: 400ms
retry.baseDelayMs=100
